<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Processos SGQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#dfeeff;
    --top1:#0f3cc9;
    --top2:#1d4eff;
    --card:#ffffff;
    --text:#1f2937;
    --border:#cbd5e1;
    --success:#16a34a;
    --warning:#f59e0b;
    --danger:#dc2626;
}


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;

}


/* =========================
   TOPO
========================= */

header{

    height:90px;
    background:linear-gradient(
        135deg,
        var(--top1),
        var(--top2)
    );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
    font-weight:800;

    letter-spacing:1px;

    box-shadow:0 4px 12px #0003;

}


/* =========================
   MENU LATERAL
========================= */


.container{

    display:flex;
    min-height:calc(100vh - 90px);

}



.sidebar{

    width:270px;

    background:white;

    border-right:1px solid var(--border);

    padding:20px;

    transition:.3s;

}



.sidebar h2{

    color:#0f3cc9;

    font-size:22px;

    margin-bottom:25px;

}



.menu button{

    width:100%;

    border:none;

    background:#edf4ff;

    margin-bottom:12px;

    padding:15px;

    border-radius:10px;

    cursor:pointer;

    text-align:left;

    font-size:17px;

    font-weight:700;

    color:#123;

    transition:.2s;

}



.menu button:hover{

    background:#1d4eff;

    color:white;

}



/* =========================
   CONTEÚDO
========================= */


.main{

    flex:1;

    padding:25px;

    overflow:auto;

}



.page-title{

    font-size:32px;

    font-weight:900;

    color:#0f3cc9;

    margin-bottom:25px;

}


/* =========================
   CARDS KPI
========================= */


.cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:25px;

}



.card{

    background:white;

    border-radius:18px;

    padding:22px;

    box-shadow:
    0 5px 15px #0002;

    border:1px solid #dbeafe;

}



.card .icon{

    font-size:35px;

}



.card h3{

    font-size:18px;

    margin-top:10px;

}



.card .valor{

    font-size:32px;

    font-weight:900;

    color:#0f3cc9;

    margin-top:10px;

}



/* =========================
   GRÁFICOS
========================= */


.chart-box{

    background:white;

    border-radius:18px;

    padding:25px;

    margin-top:25px;

    box-shadow:
    0 5px 15px #0002;

}



.chart-box h2{

    font-size:24px;

    margin-bottom:20px;

    color:#0f3cc9;

}



canvas{

    max-height:400px;

}



/* =========================
   TABELAS
========================= */


.table-box{

    background:white;

    border-radius:18px;

    padding:20px;

    margin-top:25px;

    overflow:auto;

}



table{

    width:100%;

    border-collapse:collapse;

    font-size:16px;

}



th{

    background:#0f3cc9;

    color:white;

    padding:12px;

}



td{

    padding:12px;

    border-bottom:1px solid #ddd;

}



tr:hover{

    background:#eef5ff;

}



/* =========================
   FILTROS
========================= */


input{

    padding:12px;

    border-radius:8px;

    border:1px solid #aaa;

    font-size:16px;

    width:100%;

    margin-bottom:15px;

}



/* =========================
   RESPONSIVO
========================= */


@media(max-width:900px){

.sidebar{

    width:80px;

}


.sidebar h2{

    display:none;

}


.menu button{

    font-size:0;

}


.main{

    padding:15px;

}

}


</style>

</head>


<body>


<header>

📊 PAINEL DE PROCESSOS SGQ

</header>


<div class="container">


<aside class="sidebar">


<h2>MENU SGQ</h2>


<div class="menu">


<button onclick="abrirAba('inicio')">
🏠 Início
</button>


<button onclick="abrirAba('importacao')">
📦 Inspeção Importação
</button>


<button onclick="abrirAba('descarte')">
⚠️ Descarte
</button>


<button onclick="abrirAba('esfig')">
🔧 Aferição ESFIG
</button>


<button onclick="abrirAba('retrabalho')">
♻️ Retrabalho
</button>


<button onclick="abrirAba('amostra')">
🔎 Amostras
</button>


</div>


</aside>



<main class="main">


<div id="conteudo">


</div>


</main>


</div>
