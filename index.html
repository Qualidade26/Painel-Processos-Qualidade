<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel de Processos SGQ</title>


    <!-- =====================================================
         ESTILOS PRINCIPAIS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=8"
    >

    <link
        rel="stylesheet"
        href="importacao.css?v=8"
    >

    <link
        rel="stylesheet"
        href="esfig.css?v=8"
    >

    <link
        rel="stylesheet"
        href="descarte.css?v=8"
    >

    <link
        rel="stylesheet"
        href="amostras.css?v=8"
    >

    <link
        rel="stylesheet"
        href="retrabalho.css?v=8"
    >

    <!--
    Ative esta linha somente quando o arquivo fornecedores.css existir.

    <link
        rel="stylesheet"
        href="fornecedores.css?v=8"
    >
    -->

</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="topbar">

        <div class="logo-labor">

            <div class="logo-main">
                LABOR
            </div>

            <div class="logo-sub">
                HEALTH SUPPLY
            </div>

        </div>


        <div class="top-title">

            <h1>
                PAINEL DE PROCESSOS SGQ
            </h1>

            <p>
                Indicadores operacionais em tempo real
            </p>

        </div>


        <div class="top-status">

            <span
                class="pill data-pill"
                id="dataAtual"
            >
                -- --- ----
            </span>

            <span
                class="pill time-pill"
                id="horaAtual"
            >
                --:--:--
            </span>

            <span class="pill">

                <span class="online-dot">
                    ●
                </span>

                Online

            </span>

        </div>

    </header>


    <!-- =====================================================
         ESTRUTURA PRINCIPAL
    ====================================================== -->

    <div
        class="main-wrap"
        id="mainWrap"
    >

        <!-- =================================================
             MENU LATERAL
        ================================================== -->

        <aside
            class="menu"
            id="menuLateral"
        >

            <button
                type="button"
                class="toggle-menu"
                id="btnToggleMenu"
                onclick="toggleMenu()"
                title="Esconder menu"
            >
                ◀
            </button>


            <button
                type="button"
                class="active"
                onclick="abrirAba('importacao', this)"
            >

                <span class="ico">
                    📦
                </span>

                <span class="label">
                    Inspeção
                    <br>
                    Importação
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('esfig', this)"
            >

                <span class="ico">
                    ⏱
                </span>

                <span class="label">
                    Esfigmomanômetro
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('descarte', this)"
            >

                <span class="ico">
                    🗑
                </span>

                <span class="label">
                    Descarte
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('amostra', this)"
            >

                <span class="ico">
                    📦
                </span>

                <span class="label">
                    Amostra
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('retrabalho', this)"
            >

                <span class="ico">
                    🔄
                </span>

                <span class="label">
                    Retrabalho
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('fornecedores', this)"
            >

                <span class="ico">
                    🏭
                </span>

                <span class="label">
                    Fornecedores
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('informativo', this)"
            >

                <span class="ico">
                    ℹ️
                </span>

                <span class="label">
                    Informativo
                </span>

            </button>

        </aside>


        <!-- =================================================
             CONTEÚDO DAS ABAS
        ================================================== -->

        <main
            class="content"
            id="conteudo"
        >
        </main>

    </div>


    <!-- =====================================================
         BIBLIOTECAS DE GRÁFICOS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"
    ></script>


    <!-- =====================================================
         TEMA GLOBAL DOS GRÁFICOS
    ====================================================== -->

    <script src="chart-theme.js?v=4"></script>


    <!-- =====================================================
         FUNÇÕES AUXILIARES
    ====================================================== -->

    <script src="utils.js?v=7"></script>


    <!-- =====================================================
         ARQUIVOS DAS ABAS
    ====================================================== -->

    <script src="importacao.js?v=7"></script>

    <script src="esfig.js?v=4"></script>

    <script src="descarte.js?v=7"></script>

    <script src="amostras.js?v=13"></script>

    <script src="retrabalho.js?v=7"></script>

    <script src="fornecedores.js?v=7"></script>


    <!-- =====================================================
         CONTROLE PRINCIPAL DO PAINEL
    ====================================================== -->

    <script src="script.js?v=7"></script>

</body>

</html>
