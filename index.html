<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Painel de Processos do Sistema de Gestão da Qualidade"
    >

    <title>
        Painel de Processos SGQ
    </title>


    <!-- =====================================================
         CSS PRINCIPAL

         O arquivo style.css importa:
         - base.css
         - layout.css
         - componentes.css
         - responsivo.css
         - CSS de todas as páginas
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css?v=20"
    >


    <!-- =====================================================
         MODO APRESENTAÇÃO
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/paginas/apresentacao.css?v=4"
    >

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="topbar">


        <!-- =================================================
             LOGO LABOR
        ================================================== -->

        <div class="logo-labor">

            <div class="logo-main">
                LABOR
            </div>

            <div class="logo-sub">
                HEALTH SUPPLY
            </div>

        </div>



        <!-- =================================================
             TÍTULO
        ================================================== -->

        <div class="top-title">

            <h1>
                PAINEL DE PROCESSOS SGQ
            </h1>

        </div>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div class="top-status">

            <span
                class="pill data-pill"
                id="dataAtual"
            >
                -- --- ----
            </span>

            <span
                class="pill time-pill"
                id="horaAtual"
            >
                --:--:--
            </span>

            <span class="pill">

                <span
                    class="online-dot"
                    aria-hidden="true"
                >
                    ●
                </span>

                Online

            </span>

        </div>

    </header>


    <!-- =====================================================
         ESTRUTURA PRINCIPAL
    ====================================================== -->

    <div
        class="main-wrap"
        id="mainWrap"
    >


        <!-- =================================================
             MENU LATERAL
        ================================================== -->

        <aside
            class="menu"
            id="menuLateral"
            aria-label="Menu principal"
        >


            <!-- =============================================
                 RECOLHER / EXPANDIR MENU
            ============================================== -->

            <button
                type="button"
                class="toggle-menu"
                id="btnToggleMenu"
                onclick="toggleMenu()"
                title="Esconder menu"
                aria-label="Esconder menu lateral"
            >
                ◀
            </button>
<!-- =============================================
     MODO APRESENTAÇÃO
============================================== -->

<button
    type="button"
    id="btnModoApresentacao"
    class="menu-apresentacao"
    onclick="abrirModoApresentacao()"
    title="Abrir modo apresentação"
    aria-label="Abrir modo apresentação"
>

    <span
        class="ico"
        aria-hidden="true"
    >
       🖥️
    </span>

    <span class="label">

     Modo Apresentação

    </span>

</button>

            <!-- =============================================
                 INSPEÇÃO DE IMPORTAÇÃO
            ============================================== -->

            <button
                type="button"
                class="active"
                onclick="abrirAba('importacao', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    📦
                </span>

                <span class="label">
                    Inspeção
                    <br>
                    Importação
                </span>

            </button>


            <!-- =============================================
                 ESFIG
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('esfig', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    ⏱
                </span>

                <span class="label">
                    Esfigmo
                </span>

            </button>


            <!-- =============================================
                 DESCARTE
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('descarte', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    🗑
                </span>

                <span class="label">
                    Descarte
                </span>

            </button>


            <!-- =============================================
                 AMOSTRA
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('amostra', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    📦
                </span>

                <span class="label">
                    Amostra
                </span>

            </button>


            <!-- =============================================
                 RETRABALHO
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('retrabalho', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    🔄
                </span>

                <span class="label">
                    Retrabalho
                </span>

            </button>


            <!-- =============================================
                 FORNECEDORES
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('fornecedores', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    🏭
                </span>

                <span class="label">
                    Fornecedores
                </span>

            </button>


            <!-- =============================================
                 RELATÓRIOS
            ============================================== -->

            <button
                type="button"
                onclick="abrirAba('relatorios', this)"
            >

                <span
                    class="ico"
                    aria-hidden="true"
                >
                    📄
                </span>

                <span class="label">
                    Relatórios
                </span>

            </button>


        </aside>


        <!-- =================================================
             CONTEÚDO DINÂMICO DAS ABAS
        ================================================== -->

        <main
            class="content"
            id="conteudo"
            aria-live="polite"
        >

            <noscript>

                <div class="aviso-sistema">

                    Para utilizar este painel, habilite o
                    JavaScript no navegador.

                </div>

            </noscript>

        </main>


    </div>


   <!-- =====================================================
     MODO APRESENTAÇÃO
     BARRA DE CONTROLE — NOVO LAYOUT
====================================================== -->

<div
    id="barraApresentacao"
    class="barra-apresentacao"
    aria-hidden="true"
>

    <!-- =================================================
         LINHA SUPERIOR
         IDENTIFICAÇÃO + FLUXOGRAMA
    ================================================== -->

    <div class="apres-topo">

        <div class="apres-identificacao">

            <div
                class="apres-icone-processo"
                aria-hidden="true"
            >
                📦
            </div>

            <div class="apres-tela-atual">

                <span
                    id="apresProcesso"
                    class="apres-processo"
                >
                    Importação
                </span>

                <span
                    id="apresSubaba"
                    class="apres-subaba"
                >
                    Indicador de Importação
                </span>

            </div>

        </div>


        <button
            type="button"
            id="apresFluxograma"
            class="apres-btn apres-btn-fluxograma"
            onclick="abrirFluxogramaSGQ()"
            title="Mostrar Fluxograma SGQ"
            aria-label="Mostrar Fluxograma SGQ"
        >
            🗺️
            <span>Fluxograma SGQ</span>
        </button>

    </div>


    <!-- =================================================
         LINHA INFERIOR
         CONTROLES
    ================================================== -->

    <div class="apres-controles-principais">

        <!-- ANTERIOR -->

        <button
            type="button"
            id="apresAnterior"
            class="apres-btn apres-btn-nav"
            title="Tela anterior"
            aria-label="Tela anterior"
        >
            ←
        </button>


        <!-- CONTADOR -->

        <div
            id="apresContador"
            class="apres-contador"
        >
            1 / 11
        </div>


        <!-- PRÓXIMO -->

        <button
            type="button"
            id="apresProximo"
            class="apres-btn apres-btn-nav"
            title="Próxima tela"
            aria-label="Próxima tela"
        >
            →
        </button>


        <span
            class="apres-divisor"
            aria-hidden="true"
        ></span>


        <!-- MODO -->

        <div class="apres-modo">

            <span
                class="apres-modo-icone"
                aria-hidden="true"
            >
                ✋
            </span>

            <strong id="apresModoAtual">
                Manual
            </strong>

        </div>


        <span
            class="apres-divisor"
            aria-hidden="true"
        ></span>


        <!-- TEMPO -->

        <div class="apres-tempo">

            <span
                class="apres-tempo-icone"
                aria-hidden="true"
            >
                ◷
            </span>

            <label for="apresTempo">
                Tempo:
            </label>

            <select
                id="apresTempo"
                aria-label="Tempo de cada tela"
            >

                <option value="5000">
                    5 segundos
                </option>

                <option value="10000">
                    10 segundos
                </option>

                <option value="15000">
                    15 segundos
                </option>

                <option
                    value="20000"
                    selected
                >
                    20 segundos
                </option>

            </select>

        </div>


        <span
            class="apres-divisor"
            aria-hidden="true"
        ></span>


        <!-- AUTOMÁTICO -->

        <button
            type="button"
            id="apresPlay"
            class="apres-btn apres-btn-play"
            title="Iniciar apresentação automática"
            aria-label="Iniciar apresentação automática"
        >
            ▶ Iniciar automático
        </button>


        <!-- OCULTAR -->

        <button
            type="button"
            id="apresOcultar"
            class="apres-btn apres-btn-ocultar"
            title="Ocultar controles"
            aria-label="Ocultar barra de apresentação"
        >
            ◉
        </button>

    </div>

</div>
    <!-- =====================================================
         BOTÃO SAIR DA APRESENTAÇÃO

         Este botão fica fora da barra para permanecer
         disponível mesmo quando a barra estiver oculta.
    ====================================================== -->

    <button
        type="button"
        id="apresFechar"
        class="apres-fechar"
        title="Sair do modo apresentação"
        aria-label="Sair do modo apresentação"
    >
        ×
    </button>


    <!-- =====================================================
         BIBLIOTECAS EXTERNAS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"
    ></script>


    <!-- =====================================================
         REGISTRO DO PLUGIN CHART DATA LABELS
    ====================================================== -->

    <script>

        if (
            typeof Chart !== "undefined" &&
            typeof ChartDataLabels !== "undefined"
        ) {

            Chart.register(
                ChartDataLabels
            );

            console.log(
                "Plugin ChartDataLabels registrado com sucesso."
            );

        } else {

            console.error(
                "Chart.js ou ChartDataLabels não foi carregado."
            );

        }

    </script>


    <!-- =====================================================
         TEMA GLOBAL DOS GRÁFICOS
    ====================================================== -->

    <script src="js/chart-theme.js?v=26"></script>


    <!-- =====================================================
         FUNÇÕES AUXILIARES
    ====================================================== -->

    <script src="js/utils.js?v=25"></script>


    <!-- =====================================================
         ARQUIVOS DAS ABAS
    ====================================================== -->

    <script src="js/importacao.js?v=31"></script>

    <script src="js/esfig.js?v=25"></script>

    <script src="js/descarte.js?v=25"></script>

    <script src="js/amostras.js?v=25"></script>

    <script src="js/retrabalho.js?v=25"></script>

    <script src="js/fornecedores.js?v=32"></script>

    <script src="js/relatorios.js?v=1"></script>


    <!-- =====================================================
         CONTROLE PRINCIPAL
    ====================================================== -->

    <script src="js/script.js?v=25"></script>


    <!-- =====================================================
         CONTROLE DO MODO APRESENTAÇÃO
    ====================================================== -->

    <script src="js/apresentacao.js?v=5"></script>


</body>

</html>
