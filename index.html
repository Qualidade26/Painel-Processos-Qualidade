<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Processos SGQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{

    --bg:#dfeeff;

    --top1:#0f3cc9;
    --top2:#1d4eff;

    --card:#f8fbff;
    --card2:#eef5ff;

    --primary:#1d4eff;
    --primary-dark:#0f3cc9;

    --line:#b8d1ff;
    --line2:#dce8ff;

    --text:#0f1f4d;
    --muted:#5c6c96;

    --green:#22c55e;
    --pink:#f04dd8;
    --purple:#8b5cf6;
    --red:#ef4444;
    --orange:#f97316;
    --cyan:#38bdf8;

}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

}



/* ===========================
   TOPO
=========================== */


.topbar{

    height:72px;

    background:
    linear-gradient(
        90deg,
        var(--top1),
        var(--top2)
    );

    color:white;

    display:grid;

    grid-template-columns:
    260px
    1fr
    310px;

    align-items:center;

    padding:0 18px;

    box-shadow:
    0 4px 12px rgba(0,0,0,.18);

}



.logo-labor{

    border-right:
    1px solid rgba(255,255,255,.35);

    height:55px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}



.logo-main{

    font-size:34px;

    font-weight:900;

    letter-spacing:5px;

}



.logo-sub{

    font-size:10px;

    font-weight:900;

    letter-spacing:5px;

    margin-top:6px;

}



.top-title{

    text-align:center;

}


.top-title h1{

    margin:0;

    font-size:27px;

    font-weight:900;

}



.top-title p{

    margin:6px 0 0;

    font-size:12px;

    font-weight:900;

}



.top-status{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:8px;

}



.pill{

    background:
    rgba(255,255,255,.16);

    border:
    1px solid rgba(255,255,255,.25);

    padding:
    9px 12px;

    border-radius:10px;

    min-width:116px;

    height:36px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:11px;

    font-weight:900;

}


.data-pill{

    min-width:132px;

}


.online-dot{

    color:#27ff6f;

    margin-right:4px;

}



/* ===========================
   ESTRUTURA PRINCIPAL
=========================== */


.main-wrap{

    height:
    calc(100vh - 72px);

    display:grid;

    grid-template-columns:
    172px
    1fr;

    gap:10px;

    padding:10px;

    transition:.25s;

}



.main-wrap.menu-collapsed{

    grid-template-columns:
    68px
    1fr;

}



/* ===========================
 MENU
=========================== */


.menu{

    background:
    rgba(248,251,255,.95);

    border:
    1px solid var(--line);

    border-radius:12px;

    padding:10px;

    overflow:auto;

}



.toggle-menu{

    width:100%;

    height:34px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        90deg,
        var(--top1),
        var(--top2)
    );

    color:white;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

}



.menu button{

    width:100%;

    min-height:58px;

    margin-top:8px;

    border-radius:11px;

    border:
    1px solid var(--line2);

    background:
    linear-gradient(
        180deg,
        #fff,
        var(--card2)
    );

    color:var(--text);

    font-size:12px;

    font-weight:900;

    cursor:pointer;

}



.menu button .ico{

    display:block;

    font-size:25px;

}


.menu button:hover,
.menu button.active{

    background:
    linear-gradient(
        90deg,
        var(--top1),
        var(--top2)
    );

    color:white;

}



/* ===========================
 CONTEÚDO
=========================== */


.content{

    overflow:auto;

    padding-right:3px;

}



.page-title{

    background:white;

    border:
    1px solid var(--line);

    border-radius:12px;

    padding:10px;

    text-align:center;

    color:var(--primary);

    font-size:18px;

    font-weight:900;

    margin-bottom:10px;

}



.cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:10px;

}



.kpi-card{

    background:
    linear-gradient(
        180deg,
        #fff,
        var(--card2)
    );

    border:
    1px solid var(--line);

    border-radius:12px;

    padding:12px;

    display:grid;

    grid-template-columns:
    45px
    1fr;

    align-items:center;

}


.kpi-icon{

    width:40px;

    height:40px;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#e8f0ff;

    font-size:25px;

}



.kpi-card h3{

    margin:0;

    font-size:12px;

    color:var(--primary);

}


.kpi-card strong{

    font-size:27px;

    font-weight:900;

}


.kpi-card small{

    font-size:10px;

    color:var(--muted);

}
/* ===========================
   PAINÉIS
=========================== */


.panel{

    background:
    rgba(248,251,255,.95);

    border:
    1px solid var(--line);

    border-radius:12px;

    padding:12px;

    margin-top:10px;

    box-shadow:
    0 4px 10px rgba(0,0,0,.05);

}



.panel h3{

    margin:

    0 0 10px;

    text-align:center;

    color:var(--primary);

    font-size:15px;

    font-weight:900;

    text-transform:uppercase;

}




.grid-2{

    display:grid;

    grid-template-columns:

    1fr 1fr;

    gap:10px;

}



.grid-3-2{

    display:grid;

    grid-template-columns:

    1.35fr .9fr;

    gap:10px;

}




/* ===========================
   GRÁFICOS
=========================== */


.chart-box{

    height:300px;

    position:relative;

}



.chart-box.small{

    height:230px;

}



.chart-box.tall{

    height:360px;

}



.chart-box.esfig-large{

    height:480px;

}



.chart-box.retrabalho{

    height:420px;

}





/* ===========================
   TABELAS
=========================== */


.table-wrap{

    width:100%;

    border:

    1px solid var(--line2);

    border-radius:10px;

    overflow:hidden;

    background:white;

}



.table-scroll{

    max-height:300px;

    overflow-y:auto;

}



table{

    width:100%;

    border-collapse:collapse;

    table-layout:fixed;

    font-size:13px;

}



thead th{

    position:sticky;

    top:0;

    z-index:5;

    background:#e8f0ff;

    color:var(--primary);

    padding:10px;

    border-bottom:

    1px solid var(--line);

    font-weight:900;

}



td{

    padding:8px;

    border-bottom:

    1px solid var(--line2);

    text-align:center;

    font-weight:800;

}



td.desc{

    text-align:left;

}



.status-ok{

    color:var(--green);

}



.status-nok{

    color:var(--red);

}





/* ===========================
   ROLAGEM AUTOMÁTICA
=========================== */


.table-scroll.infinite{

    overflow:hidden;

}



.scroll-content{

    animation:

    scrollVertical 25s linear infinite;

}



.table-scroll.infinite:hover 
.scroll-content{

    animation-play-state:paused;

}



@keyframes scrollVertical{

    from{

        transform:translateY(0);

    }


    to{

        transform:translateY(-50%);

    }

}




/* ===========================
   FLUXO ESFIG
=========================== */


.fluxo{

    display:grid;

    grid-template-columns:

    1fr 35px 1fr 35px 1fr;

    align-items:center;

    gap:5px;

}



.fluxo-item{

    background:#eef5ff;

    border:

    1px solid var(--line2);

    border-radius:12px;

    padding:15px 8px;

    text-align:center;

    font-weight:900;

}



.fluxo-item strong{

    display:block;

    font-size:27px;

    color:var(--primary);

}



.fluxo-item.pink strong{

    color:var(--pink);

}



.fluxo-item.green strong{

    color:var(--green);

}



.fluxo-arrow{

    text-align:center;

    font-size:25px;

    font-weight:900;

}



.progress-title{

    text-align:center;

    font-size:12px;

    font-weight:900;

    margin:10px;

}



.progress-box{

    width:100%;

    height:22px;

    background:#dce8ff;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar{

    height:100%;

    background:

    linear-gradient(
        90deg,
        #16a34a,
        #22c55e
    );

    color:white;

    text-align:center;

    line-height:22px;

    font-size:12px;

    font-weight:900;

}




/* ===========================
   RANKING
=========================== */


.rank-grid{

    display:grid;

    grid-template-columns:

    repeat(3,1fr);

    gap:8px;

}



.rank-card{

    background:#e8f0ff;

    border:

    1px solid var(--line);

    border-radius:10px;

    padding:10px;

    font-size:12px;

    font-weight:900;

}



.rank-num{

    display:inline-flex;

    width:22px;

    height:22px;

    border-radius:50%;

    background:var(--primary);

    color:white;

    align-items:center;

    justify-content:center;

    margin-bottom:5px;

}




/* ===========================
   PESQUISA RETRABALHO
=========================== */


.barra-pesquisa{

    width:100%;

    padding:12px;

    border:

    1px solid var(--line);

    border-radius:10px;

    margin-bottom:10px;

    font-weight:900;

    font-size:14px;

}



/* ===========================
   SENHA DESCARTE
=========================== */


.senha-box{

    max-width:430px;

    margin:80px auto;

    background:white;

    padding:25px;

    border-radius:15px;

    border:

    1px solid var(--line);

    text-align:center;

}



.senha-box input{

    width:100%;

    padding:12px;

    border-radius:10px;

    border:

    1px solid var(--line);

    text-align:center;

}



.btn{

    margin-top:10px;

    background:var(--primary);

    color:white;

    border:none;

    border-radius:10px;

    padding:12px 20px;

    font-weight:900;

    cursor:pointer;

}



/* ===========================
   INFORMativo
=========================== */


.info-menu{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    justify-content:center;

}



.info-menu button{

    background:var(--primary);

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:10px;

    font-weight:900;

}



.info-text{

    text-align:center;

    font-size:16px;

    font-weight:700;

    line-height:1.6;

}



.process-steps{

    display:grid;

    grid-template-columns:

    repeat(auto-fit,minmax(150px,1fr));

    gap:8px;

}



.step{

    background:#e8f0ff;

    border:

    1px solid var(--line);

    border-radius:12px;

    padding:12px;

    text-align:center;

    font-weight:900;

}



.step span{

    display:inline-flex;

    width:25px;

    height:25px;

    background:var(--primary);

    color:white;

    border-radius:50%;

    justify-content:center;

    align-items:center;

}



/* ===========================
 RESPONSIVO
=========================== */


@media(max-width:1050px){


.topbar{

    grid-template-columns:1fr;

    height:auto;

    gap:10px;

    padding:10px;

}


.logo-labor{

    border:none;

    align-items:center;

}



.top-status{

    justify-content:center;

    flex-wrap:wrap;

}



.main-wrap,
.main-wrap.menu-collapsed{

    grid-template-columns:1fr;

    height:auto;

}



.menu{

    display:grid;

    grid-template-columns:repeat(2,1fr);

}



.grid-2,
.grid-3-2{

    grid-template-columns:1fr;

}



.fluxo{

    grid-template-columns:1fr;

}



.fluxo-arrow{

    transform:rotate(90deg);

}


}
</style>
</head>

<body>


<header class="topbar">


    <div class="logo-labor">

        <div class="logo-main">
            LABOR
        </div>

        <div class="logo-sub">
            HEALTH SUPPLY
        </div>

    </div>



    <div class="top-title">

        <h1>
            PAINEL DE PROCESSOS SGQ
        </h1>

        <p>
            Indicadores operacionais em tempo real
        </p>

    </div>



    <div class="top-status">

        <span class="pill data-pill" id="dataAtual">
            -- --- ----
        </span>


        <span class="pill time-pill" id="horaAtual">
            --:--:--
        </span>


        <span class="pill">
            <span class="online-dot">●</span>
            Online
        </span>


    </div>


</header>




<div class="main-wrap" id="mainWrap">



<aside class="menu" id="menuLateral">


<button 
class="toggle-menu"
id="btnToggleMenu"
onclick="toggleMenu()">

◀

</button>



<button 
class="active"
onclick="abrirAba('importacao',this)">

<span class="ico">
📦
</span>

<span class="label">
Inspeção<br>
Importação
</span>

</button>




<button onclick="abrirAba('esfig',this)">

<span class="ico">
⏱
</span>

<span class="label">
Esfigmomanômetro
</span>

</button>




<button onclick="abrirAba('descarte',this)">

<span class="ico">
🗑
</span>

<span class="label">
Descarte
</span>

</button>




<button onclick="abrirAba('amostra',this)">

<span class="ico">
📦
</span>

<span class="label">
Amostra
</span>

</button>




<button onclick="abrirAba('retrabalho',this)">

<span class="ico">
🔄
</span>

<span class="label">
Retrabalho
</span>

</button>




<button onclick="abrirAba('equipamentos',this)">

<span class="ico">
🛠
</span>

<span class="label">
Equipamentos
</span>

</button>




<button onclick="abrirAba('informativo',this)">

<span class="ico">
ℹ️
</span>

<span class="label">
Informativo
</span>

</button>



</aside>




<main 
class="content"
id="conteudo">

</main>



</div>





<script>


/* ==================================================
   VARIÁVEIS PRINCIPAIS
================================================== */


let dados = {};

let graficoAtual = null;

let chartRetrabalho = null;

let senhaDescarteLiberada = false;





/* ==================================================
   PLUGIN VALORES NOS GRÁFICOS
================================================== */


const valorFlutuantePlugin = {


id:"valorFlutuante",


afterDatasetsDraw(chart){


const {ctx}=chart;


ctx.save();



chart.data.datasets.forEach((dataset,index)=>{


const meta =
chart.getDatasetMeta(index);



if(meta.hidden)
return;



meta.data.forEach((element,i)=>{


const valor =
dataset.data[i];



if(valor===null || valor===undefined)
return;



ctx.font =
"900 11px Arial";



ctx.fillStyle =
"#0f1f4d";



let texto =
numero(valor);



if(dataset._moeda)
texto =
moeda(valor);



if(dataset._horas)
texto =
numero(valor)+" h";




ctx.textAlign="center";

ctx.textBaseline="bottom";



ctx.fillText(
texto,
element.x,
element.y-8
);



});

});


ctx.restore();


}


};




Chart.register(valorFlutuantePlugin);






/* ==================================================
   CARREGAMENTO INICIAL JSON
================================================== */



fetch("data.json")


.then(response=>{


if(!response.ok){

throw new Error(
"Erro ao carregar JSON"
);

}


return response.json();


})


.then(json=>{


dados =
normalizarDados(json);



renderImportacao();



})



.catch(error=>{


console.error(error);



dados =
normalizarDados({});



renderImportacao();


});







/* ==================================================
   ATUALIZAÇÃO AUTOMÁTICA
   A CADA 2 MINUTOS
================================================== */


setInterval(()=>{


fetch("data.json")


.then(r=>r.json())


.then(json=>{


dados =
normalizarDados(json);



const ativa =
document.querySelector(
".menu button.active"
);



if(ativa){

ativa.click();

}



});


},120000);






/* ==================================================
   NORMALIZA JSON
================================================== */


function normalizarDados(json){



/*
Compatibilidade caso
esfig venha como array
*/


if(Array.isArray(json.esfig)){


json.esfig={


ultimaAfericao:
json.ultimaAfericao || "",



proximaAfericao:
json.proximaAfericao || "",



produtos:
json.esfig



};


}




/*
Compatibilidade retrabalho
*/


if(!Array.isArray(json.retrabalho)){


json.retrabalho=[];


}



return json;


}






/* ==================================================
   CONTROLE DAS ABAS
================================================== */


function abrirAba(aba,botao){



document
.querySelectorAll(".menu button")
.forEach(b=>
b.classList.remove("active")
);



if(botao)
botao.classList.add("active");



destruirGrafico();




switch(aba){


case "importacao":
renderImportacao();
break;



case "esfig":
renderEsfig();
break;



case "descarte":
renderDescarte();
break;



case "amostra":
renderAmostra();
break;



case "retrabalho":
renderRetrabalho();
break;



case "equipamentos":
renderEquipamentos();
break;



case "informativo":
renderInformativo();
break;


}



}






/* ==================================================
   DESTRUIR TODOS OS GRÁFICOS
================================================== */


function destruirGrafico(){



if(graficoAtual){


graficoAtual.destroy();


graficoAtual=null;


}




if(chartRetrabalho){


chartRetrabalho.destroy();


chartRetrabalho=null;


}



}







/* ==================================================
   FUNÇÕES BÁSICAS
================================================== */


function numero(v){


return Number(v||0)
.toLocaleString("pt-BR");


}




function moeda(v){


return Number(v||0)
.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);


}





function atualizarRelogio(){


const agora =
new Date();



document.getElementById(
"horaAtual"
).innerText =
agora.toLocaleTimeString("pt-BR");



document.getElementById(
"dataAtual"
).innerText =
agora.toLocaleDateString(
"pt-BR",
{
day:"2-digit",
month:"long",
year:"numeric"
}
)
.toUpperCase();



}



setInterval(
atualizarRelogio,
1000
);


atualizarRelogio();






/* ==================================================
   MENU RETRÁTIL
================================================== */


function toggleMenu(){



const wrap =
document.getElementById(
"mainWrap"
);



const btn =
document.getElementById(
"btnToggleMenu"
);



wrap.classList.toggle(
"menu-collapsed"
);



btn.innerText =
wrap.classList.contains(
"menu-collapsed"
)
?
"▶"
:
"◀";



}
/* ==================================================
   ABA IMPORTAÇÃO
================================================== */


function renderImportacao(){


const imp =
dados.importacao || {

processosAno:0,
totalSku:0,
totalLotes:0,
laudosEmitidos:0,
totalHoras:0,
mensal:[],
fluxo:[]

};



conteudo.innerHTML = `


<div class="page-title">
📦 INSPEÇÃO DE IMPORTAÇÃO
</div>



<section class="cards">


${card(
"📦",
"Processos Ano",
numero(imp.processosAno),
"Quantidade"
)}



${card(
"🏷️",
"Total SKU",
numero(imp.totalSku),
"Produtos"
)}



${card(
"📑",
"Lotes",
numero(imp.totalLotes),
"Controlados"
)}



${card(
"🧾",
"Laudos",
numero(imp.laudosEmitidos),
"Emitidos"
)}



${card(
"⏱",
"Horas",
numero(imp.totalHoras),
"Atividade"
)}



</section>




<section class="panel">


<h3>
📊 Evolução Mensal Importação
</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>





<section class="panel">


<h3>
Fluxo Importação
</h3>


${tabelaFixa(
[
"PO",
"Produto",
"Status",
"Observação"
],
montarLinhasImportacao(
imp.fluxo
),
false
)}



</section>



`;



graficoAtual =
new Chart(
document.getElementById("grafico"),
{


type:"line",



data:{


labels:
(imp.mensal||[])
.map(i=>i.mes),



datasets:[


dsLine(
"Processos",
(imp.mensal||[])
.map(i=>i.processos||0),
"#1d4eff"
),



dsLine(
"SKU",
(imp.mensal||[])
.map(i=>i.sku||i.SKU||0),
"#f04dd8"
),



dsLine(
"Lotes",
(imp.mensal||[])
.map(i=>i.lotes||i.Lotes||0),
"#22c55e"
),



dsLine(
"Laudos",
(imp.mensal||[])
.map(i=>i.laudos||i.Laudos||0),
"#8b5cf6"
),



dsLine(
"Horas",
(imp.mensal||[])
.map(i=>i.horas||0),
"#f97316"
)



]

},


options:baseOptions()


});



}








/* ==================================================
   ABA ESFIGMOMANÔMETRO
================================================== */


function renderEsfig(){



const esfig =
dados.esfig || {};



const produtos =
esfig.produtos || [];



const aguardando =
produtos.reduce(
(s,i)=>s+Number(i.aguardando||0),
0
);



const desmontado =
produtos.reduce(
(s,i)=>s+Number(i.desmontado||0),
0
);



const aferidos =
produtos.reduce(
(s,i)=>s+Number(i.aferidos||0),
0
);



const total =

/* ==================================================
   TABELAS

function tabelaFixa(headers,rows,infinito){



const corpo =

rows ||

`
<tr>
<td colspan="${headers.length}">
Sem dados cadastrados
</td>
</tr>
`;



const duplicado =

infinito

?

corpo + corpo

:

corpo;



return `



<div class="table-wrap">


<table>


<thead>


<tr>

${headers.map(h=>

`
<th>
${h}
</th>

`

).join("")}



</tr>


</thead>


</table>





<div class="table-scroll ${infinito?"infinite":""}">


<div class="${infinito?"scroll-content":""}">


<table>


<tbody>


${duplicado}


</tbody>


</table>


</div>


</div>



</div>



`;



}
