<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Painel de Processos SGQ
    </title>

    <!--
    |--------------------------------------------------------------------------
    | CHART.JS
    |--------------------------------------------------------------------------
    -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

    <!--
    |--------------------------------------------------------------------------
    | ESTILOS
    |--------------------------------------------------------------------------
    -->
<link rel="stylesheet" href="style.css?v=23">

</head>

<body>

    <!--
    |--------------------------------------------------------------------------
    | CABEÇALHO
    |--------------------------------------------------------------------------
    -->
    <header class="topbar">

        <div class="logo-labor">

            <div class="logo-main">
                LABOR
            </div>

            <div class="logo-sub">
                HEALTH SUPPLY
            </div>

        </div>


        <div class="top-title">

            <h1>
                PAINEL DE PROCESSOS SGQ
            </h1>

            <p>
                Indicadores operacionais em tempo real
            </p>

        </div>


        <div class="top-status">

            <span
                class="pill data-pill"
                id="dataAtual"
            >
                -- --- ----
            </span>

            <span
                class="pill time-pill"
                id="horaAtual"
            >
                --:--:--
            </span>

            <span class="pill">

                <span class="online-dot">
                    ●
                </span>

                Online

            </span>

        </div>

    </header>


    <!--
    |--------------------------------------------------------------------------
    | CONTEÚDO PRINCIPAL
    |--------------------------------------------------------------------------
    -->
    <div
        class="main-wrap"
        id="mainWrap"
    >

        <!--
        |--------------------------------------------------------------------------
        | MENU LATERAL
        |--------------------------------------------------------------------------
        -->
        <aside
            class="menu"
            id="menuLateral"
        >

            <button
                type="button"
                class="toggle-menu"
                id="btnToggleMenu"
                onclick="toggleMenu()"
                title="Esconder menu"
            >
                ◀
            </button>


            <button
                type="button"
                class="active"
                onclick="abrirAba('importacao', this)"
            >

                <span class="ico">
                    📦
                </span>

                <span class="label">
                    Inspeção
                    <br>
                    Importação
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('esfig', this)"
            >

                <span class="ico">
                    ⏱
                </span>

                <span class="label">
                    Esfigmomanômetro
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('descarte', this)"
            >

                <span class="ico">
                    🗑
                </span>

                <span class="label">
                    Descarte
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('amostra', this)"
            >

                <span class="ico">
                    📦
                </span>

                <span class="label">
                    Amostra
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('retrabalho', this)"
            >

                <span class="ico">
                    🔄
                </span>

                <span class="label">
                    Retrabalho
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('fornecedores', this)"
            >

                <span class="ico">
                    🏭
                </span>

                <span class="label">
                    Fornecedores
                </span>

            </button>


            <button
                type="button"
                onclick="abrirAba('informativo', this)"
            >

                <span class="ico">
                    ℹ️
                </span>

                <span class="label">
                    Informativo
                </span>

            </button>

        </aside>


        <!--
        |--------------------------------------------------------------------------
        | ÁREA DINÂMICA DAS ABAS
        |--------------------------------------------------------------------------
        -->
        <main
            class="content"
            id="conteudo"
        ></main>

    </div>


    <!--
    |--------------------------------------------------------------------------
    | ARQUIVOS JAVASCRIPT
    |--------------------------------------------------------------------------
    | A ordem é importante:
    |
    | 1. utils.js
    | 2. arquivos de cada aba
    | 3. script.js
    |--------------------------------------------------------------------------
    -->

  <script src="utils.js?v=7"></script>

<script src="importacao.js?v=7"></script>

<script src="esfig.js?v=7"></script>

<script src="descarte.js?v=7"></script>

<script src="amostras.js?v=12"></script>

<script src="retrabalho.js?v=7"></script>

<script src="fornecedores.js?v=7"></script>

<script src="script.js?v=7"></script>

</body>

</html>
