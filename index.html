<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Processos SGQ</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>


<style>

:root{

--bg:#dfeeff;

--top1:#0f3cc9;

--top2:#1d4eff;

--card:#f8fbff;

--card2:#eef5ff;

--primary:#1d4eff;

--primary-dark:#0f3cc9;

--line:#b8d1ff;

--line2:#dce8ff;

--text:#0f1f4d;

--muted:#5c6c96;

--green:#22c55e;

--pink:#f04dd8;

--purple:#8b5cf6;

--red:#ef4444;

--orange:#f97316;

--cyan:#38bdf8;

}


*{

box-sizing:border-box;

}



body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:var(--bg);

color:var(--text);

overflow:hidden;

}



.topbar{

height:72px;

background:linear-gradient(90deg,var(--top1),var(--top2));

display:grid;

grid-template-columns:260px 1fr 310px;

align-items:center;

padding:0 18px;

color:white;

box-shadow:0 4px 12px rgba(0,0,0,.2);

}



.logo-labor{

height:55px;

border-right:1px solid rgba(255,255,255,.35);

display:flex;

flex-direction:column;

justify-content:center;

}



.logo-main{

font-size:34px;

font-weight:900;

letter-spacing:5px;

}



.logo-sub{

font-size:10px;

font-weight:900;

letter-spacing:5px;

}



.top-title{

text-align:center;

}



.top-title h1{

margin:0;

font-size:27px;

font-weight:900;

}



.top-title p{

margin:5px 0 0;

font-size:12px;

font-weight:900;

}



.top-status{

display:flex;

justify-content:flex-end;

gap:8px;

}



.pill{

height:36px;

padding:8px 12px;

border-radius:10px;

background:rgba(255,255,255,.16);

border:1px solid rgba(255,255,255,.3);

font-weight:900;

font-size:11px;

display:flex;

align-items:center;

}



.online-dot{

color:#2cff70;

margin-right:5px;

}




.main-wrap{

height:calc(100vh - 72px);

display:grid;

grid-template-columns:172px 1fr;

gap:10px;

padding:10px;

}



.menu{

background:#f8fbff;

border:1px solid var(--line);

border-radius:12px;

padding:10px;

overflow:auto;

}



.toggle-menu{

width:100%;

height:36px;

border:none;

border-radius:10px;

background:linear-gradient(90deg,var(--top1),var(--top2));

color:white;

font-size:18px;

font-weight:900;

cursor:pointer;

margin-bottom:10px;

}



.menu button{

width:100%;

min-height:58px;

margin-bottom:8px;

border-radius:10px;

border:1px solid var(--line2);

background:linear-gradient(#fff,var(--card2));

font-weight:900;

cursor:pointer;

color:var(--text);

}



.menu button:hover,

.menu button.active{

background:linear-gradient(90deg,var(--top1),var(--top2));

color:white;

}



.ico{

font-size:24px;

display:block;

}



.label{

font-size:12px;

}



.content{

overflow:auto;

padding-right:3px;

}



.page-title{

background:white;

border:1px solid var(--line);

border-radius:12px;

padding:10px;

text-align:center;

font-size:17px;

font-weight:900;

color:var(--primary);

margin-bottom:8px;

}



.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:8px;

margin-bottom:8px;

}



.kpi-card{

background:linear-gradient(#fff,var(--card2));

border:1px solid var(--line);

border-radius:12px;

padding:12px;

display:flex;

align-items:center;

gap:10px;

}



.kpi-icon{

font-size:28px;

background:#e8f0ff;

padding:8px;

border-radius:10px;

}



.kpi-card h3{

margin:0;

font-size:12px;

color:var(--primary);

}



.kpi-card strong{

display:block;

font-size:26px;

}



.kpi-card small{

color:var(--muted);

font-weight:900;

}



.panel{

background:#f8fbff;

border:1px solid var(--line);

border-radius:12px;

padding:10px;

margin-bottom:8px;

}



.panel h3{

text-align:center;

margin:0 0 8px;

color:var(--primary);

font-size:14px;

font-weight:900;

}



.chart-box{

height:320px;

position:relative;

}



.chart-box.tall{

height:420px;

}
<style>

.table-wrap{

border:1px solid var(--line2);

border-radius:10px;

overflow:hidden;

background:white;

}


.table-scroll{

max-height:400px;

overflow:auto;

}


table{

width:100%;

border-collapse:collapse;

font-size:13px;

}



thead th{

background:#e8f0ff;

color:var(--primary);

padding:10px;

font-weight:900;

position:sticky;

top:0;

}



td{

padding:8px;

border-bottom:1px solid var(--line2);

text-align:center;

font-weight:800;

}



td.desc{

text-align:left;

}



.status-ok{

color:var(--green);

}



.status-nok{

color:var(--red);

}



.grid-2{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

}



.grid-3-2{

display:grid;

grid-template-columns:1.35fr .9fr;

gap:8px;

}



.fluxo{

display:grid;

grid-template-columns:1fr 30px 1fr 30px 1fr;

align-items:center;

gap:5px;

margin-bottom:10px;

}



.fluxo-item{

background:#eef5ff;

border:1px solid var(--line);

border-radius:12px;

padding:12px;

text-align:center;

font-weight:900;

}



.fluxo-item strong{

display:block;

font-size:25px;

color:var(--primary);

}



.fluxo-item.pink strong{

color:var(--pink);

}



.fluxo-item.green strong{

color:var(--green);

}



.fluxo-arrow{

font-size:22px;

font-weight:900;

text-align:center;

}



.progress-box{

height:22px;

background:#dce8ff;

border-radius:20px;

overflow:hidden;

}



.progress-bar{

height:100%;

background:#22c55e;

color:white;

text-align:center;

font-size:12px;

font-weight:900;

line-height:22px;

}



.senha-box{

max-width:420px;

margin:80px auto;

background:white;

padding:25px;

border-radius:15px;

border:1px solid var(--line);

text-align:center;

}



.senha-box input{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid var(--line);

text-align:center;

font-size:18px;

}



.btn{

background:var(--primary);

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:900;

cursor:pointer;

margin-top:10px;

}



.rank-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:8px;

}



.rank-card{

background:#e8f0ff;

border:1px solid var(--line);

border-radius:10px;

padding:10px;

font-weight:900;

}



.rank-card strong{

display:block;

font-size:15px;

}



.footer-note{

text-align:center;

font-size:11px;

font-weight:900;

color:var(--primary);

}



@media(max-width:1100px){

.topbar{

grid-template-columns:1fr;

height:auto;

gap:8px;

padding:10px;

}



.main-wrap{

grid-template-columns:1fr;

}



.grid-2,

.grid-3-2{

grid-template-columns:1fr;

}

}

</style>


</head>


<body>



<header class="topbar">


<div class="logo-labor">

<div class="logo-main">
LABOR
</div>

<div class="logo-sub">
HEALTH SUPPLY
</div>

</div>



<div class="top-title">

<h1>
PAINEL DE PROCESSOS SGQ
</h1>

<p>
Indicadores operacionais em tempo real
</p>

</div>



<div class="top-status">

<span class="pill" id="dataAtual">
--/--/----
</span>


<span class="pill" id="horaAtual">
--:--:--
</span>


<span class="pill">
<span class="online-dot">●</span>
Online
</span>


</div>


</header>





<div class="main-wrap" id="mainWrap">


<aside class="menu">


<button 
class="toggle-menu"
onclick="toggleMenu()"
id="btnToggleMenu">
◀
</button>



<button class="active"
onclick="abrirAba('importacao',this)">
<span class="ico">📦</span>
Importação
</button>



<button onclick="abrirAba('esfig',this)">
<span class="ico">⏱</span>
Esfig
</button>



<button onclick="abrirAba('descarte',this)">
<span class="ico">🗑</span>
Descarte
</button>



<button onclick="abrirAba('amostra',this)">
<span class="ico">📦</span>
Amostra
</button>



<button onclick="abrirAba('retrabalho',this)">
<span class="ico">🔄</span>
Retrabalho
</button>



<button onclick="abrirAba('equipamentos',this)">
<span class="ico">🛠</span>
Equipamentos
</button>



<button onclick="abrirAba('informativo',this)">
<span class="ico">ℹ️</span>
Informativo
</button>



</aside>



<main class="content" id="conteudo"></main>



</div>





<script>


let dados={};

let graficoAtual=null;

let senhaDescarteLiberada=false;



Chart.register({

id:"valorFlutuante",

afterDatasetsDraw(chart){

const {ctx}=chart;

ctx.save();


chart.data.datasets.forEach((ds,index)=>{


const meta=chart.getDatasetMeta(index);


if(!meta.hidden){


meta.data.forEach((p,i)=>{


let valor=ds.data[i];


if(valor===undefined) return;



ctx.font="900 11px Arial";

ctx.fillStyle="#0f1f4d";


ctx.textAlign="center";

ctx.fillText(
Number(valor).toLocaleString("pt-BR"),
p.x,
p.y-8
);



});

}


});


ctx.restore();

}

});



fetch("data.json")

.then(r=>r.json())

.then(json=>{

dados=json;

renderImportacao();

})

.catch(()=>{

dados={};

renderImportacao();

});



setInterval(()=>{


fetch("data.json")

.then(r=>r.json())

.then(json=>{

dados=json;

const ativo=document.querySelector(".menu button.active");

if(ativo)
ativo.click();


});


},120000);



function destruirGrafico(){

if(graficoAtual){

graficoAtual.destroy();

graficoAtual=null;

}

}



function numero(v){

return Number(v||0)
.toLocaleString("pt-BR");

}



function moeda(v){

return Number(v||0)
.toLocaleString("pt-BR",
{
style:"currency",
currency:"BRL"
});

}



function atualizarRelogio(){


let d=new Date();


document.getElementById("dataAtual").innerText=
d.toLocaleDateString("pt-BR");


document.getElementById("horaAtual").innerText=
d.toLocaleTimeString("pt-BR");

}


setInterval(atualizarRelogio,1000);

atualizarRelogio();




function toggleMenu(){

document
.getElementById("mainWrap")
.classList.toggle("menu-collapsed");


}
function abrirAba(aba,botao){

document.querySelectorAll(".menu button")
.forEach(b=>b.classList.remove("active"));


if(botao)
botao.classList.add("active");


destruirGrafico();


switch(aba){

case "importacao":
renderImportacao();
break;


case "esfig":
renderEsfig();
break;


case "descarte":
renderDescarte();
break;


case "amostra":
renderAmostra();
break;


case "retrabalho":
renderRetrabalho();
break;


case "equipamentos":
renderEquipamentos();
break;


case "informativo":
renderInformativo();
break;

}

}




function baseOptions(){

return {


responsive:true,

maintainAspectRatio:false,


plugins:{


legend:{


labels:{


color:"#0f1f4d",

font:{
weight:"900"
}

}


}


},


scales:{


x:{

ticks:{
color:"#0f1f4d"
},

grid:{
display:false
}


},


y:{

beginAtZero:true,

ticks:{
color:"#0f1f4d"
}


}


}


};


}





function card(icon,titulo,valor,sub){


return `

<div class="kpi-card">

<div class="kpi-icon">
${icon}
</div>


<div>

<h3>
${titulo}
</h3>


<strong>
${valor}
</strong>


<small>
${sub}
</small>


</div>


</div>


`;

}







function renderImportacao(){


const imp=dados.importacao || {

processosAno:0,

totalSku:0,

totalLotes:0,

laudosEmitidos:0,

totalHoras:0,

mensal:[],

fluxo:[]

};



conteudo.innerHTML=`


<div class="page-title">
📦 INSPEÇÃO DE IMPORTAÇÃO
</div>



<section class="cards">


${card("📦","Processos Ano",numero(imp.processosAno),"Quantidade")}


${card("🏷️","SKU",numero(imp.totalSku),"Produtos")}


${card("📑","Lotes",numero(imp.totalLotes),"Controlados")}


${card("🧾","Laudos",numero(imp.laudosEmitidos),"Emitidos")}


${card("⏱","Horas",numero(imp.totalHoras),"Atividade")}



</section>




<section class="panel">

<h3>
📊 Evolução Mensal Importação
</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>




<section class="panel">

<h3>
📋 Fluxo Importação
</h3>


${tabelaFixa(

[
"PO",
"Produto",
"Status",
"Observação"
],

montarLinhasImportacao(imp.fluxo),

false

)}



</section>



`;




const meses=
(imp.mensal||[])
.map(x=>x.mes);



graficoAtual=new Chart(
document.getElementById("grafico"),

{


type:"bar",


data:{


labels:meses,


datasets:[



{

label:"Processos",

data:imp.mensal.map(x=>x.processos||0),

backgroundColor:"#1d4eff"

},



{

label:"SKU",

data:imp.mensal.map(x=>x.sku||0),

backgroundColor:"#f04dd8"

},



{

label:"Lotes",

data:imp.mensal.map(x=>x.lotes||0),

backgroundColor:"#22c55e"

},



{

label:"Laudos",

data:imp.mensal.map(x=>x.laudos||0),

backgroundColor:"#8b5cf6"

},



{

label:"Horas",

type:"line",

data:imp.mensal.map(x=>x.horas||0),

borderColor:"#f97316",

backgroundColor:"#f97316",

yAxisID:"y1",

tension:.3,

borderWidth:3

}


]


},



options:{


...baseOptions(),


interaction:{

mode:"index",

intersect:false

},


scales:{


y:{

beginAtZero:true

},



y1:{


position:"right",

beginAtZero:true,


grid:{

drawOnChartArea:false

}


}



}


}



});



}









function renderEsfig(){


const e=dados.esfig || {

produtos:[]

};



const lista=e.produtos||[];



conteudo.innerHTML=`


<div class="page-title">
⏱ ESFIGMOMANÔMETRO
</div>



<section class="grid-2">


<div class="panel">


<h3>
Fluxo Operacional
</h3>


${tabelaFixa(

[
"SKU",
"Descrição",
"Aguard.",
"Desm.",
"Afer."
],

montarLinhasEsfig(lista),

true

)}



</div>



<div class="panel">


<h3>
Total por SKU
</h3>


<div class="chart-box tall">

<canvas id="grafico"></canvas>

</div>


</div>


</section>


`;




graficoAtual=new Chart(

document.getElementById("grafico"),

{


type:"bar",


data:{


labels:
lista.map(x=>x.sku),


datasets:[{

label:"Quantidade",

data:
lista.map(x=>Number(x.totalAnualSku||0)),

backgroundColor:"#1d4eff"


}]


},


options:{


...baseOptions(),

indexAxis:"y",

plugins:{

legend:{
display:false
}

}


}


}



);



}






function renderDescarte(){


if(!senhaDescarteLiberada){


conteudo.innerHTML=`

<div class="senha-box">


<h2>
🔒 Descarte Restrito
</h2>


<input id="senhaDescarte"
type="password"
placeholder="Senha">


<button class="btn"
onclick="validarSenhaDescarte()">

Entrar

</button>


<p id="erroSenha"></p>


</div>


`;


return;

}



const d=dados.descarte||{

origens:[]

};



conteudo.innerHTML=`

<div class="page-title">
🗑 DESCARTE
</div>


<section class="panel">


<h3>
Descarte por Origem
</h3>


<div class="chart-box tall">

<canvas id="grafico"></canvas>

</div>


</section>


`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{


type:"bar",


data:{


labels:d.origens.map(x=>x.nome),


datasets:[{

label:"Valor",

data:d.origens.map(x=>x.valor),

backgroundColor:"#ef4444"


}]


},


options:{

...baseOptions(),

indexAxis:"y"

}



}


);



}



function validarSenhaDescarte(){


if(
document.getElementById("senhaDescarte").value
==="SGQ2026"

){

senhaDescarteLiberada=true;

renderDescarte();


}else{


document.getElementById("erroSenha").innerText=
"Senha incorreta";


}


}
function renderAmostra(){


const a=dados.amostra || dados.amostras || {

mensal:[]

};



conteudo.innerHTML=`

<div class="page-title">
📦 AMOSTRA
</div>


<section class="panel">


<h3>
📈 Evolução Mensal de Amostras
</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>



`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{


type:"line",


data:{


labels:(a.mensal||[]).map(x=>x.mes),


datasets:[

{

label:"Quantidade",

data:(a.mensal||[]).map(x=>x.valor||0),

borderColor:"#1d4eff",

backgroundColor:"#1d4eff",

borderWidth:3,

tension:.3

},


{

label:"Horas",

data:(a.mensal||[]).map(x=>x.horas||0),

borderColor:"#f04dd8",

backgroundColor:"#f04dd8",

borderWidth:3,

borderDash:[6,5],

tension:.3

}


]


},


options:baseOptions()


}


);



}







function renderRetrabalho(){



const r=dados.retrabalho || {

fabricantes:[]

};



conteudo.innerHTML=`

<div class="page-title">
🔄 RETRABALHO
</div>



<section class="cards">


${card(
"🔄",
"Total Retrabalhado",
numero(r.totalUnidades),
"Produtos"
)}



${card(
"⏱",
"Horas",
numero(r.totalHoras),
"Aplicadas"
)}



${card(
"📋",
"Processos",
numero(r.processos),
"Ocorrências"
)}



</section>




<section class="grid-2">


<div class="panel">


<h3>
🏭 Retrabalho por Fabricante
</h3>


<input
id="buscaFabricante"
placeholder="Pesquisar fabricante..."
onkeyup="atualizarGraficoRetrabalho()"
style="
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #b8d1ff;
margin-bottom:10px;
font-weight:900;
">


<div class="chart-box tall">

<canvas id="grafico"></canvas>

</div>


</div>




<div class="panel">


<h3>
📋 Detalhamento
</h3>


<div id="tabelaRetrabalho">


${tabelaFixa(

[
"Fabricante",
"Quantidade",
"Horas",
"Motivo"
],

montarLinhasRetrabalho(r.fabricantes),

false

)}


</div>


</div>



</section>



`;



atualizarGraficoRetrabalho();



}





function atualizarGraficoRetrabalho(){


const r=dados.retrabalho||{

fabricantes:[]

};



const busca=
(
document.getElementById("buscaFabricante")?.value
||
""
)
.toLowerCase();



const lista=
(r.fabricantes||[])

.filter(x=>

String(x.fabricante)
.toLowerCase()
.includes(busca)

)

.sort(
(a,b)=>
Number(b.quantidade||0)
-
Number(a.quantidade||0)
);



destruirGrafico();



graficoAtual=new Chart(

document.getElementById("grafico"),

{


type:"bar",


data:{


labels:
lista.map(x=>x.fabricante),


datasets:[{

label:"Quantidade",

data:
lista.map(x=>x.quantidade||0),

backgroundColor:"#1d4eff"

}]


},



options:{

...baseOptions(),

indexAxis:"y",

plugins:{

legend:{
display:false
}

}

}


}



);



}





function renderEquipamentos(){


const e=dados.equipamentos||[];



conteudo.innerHTML=`

<div class="page-title">
🛠 EQUIPAMENTOS
</div>


<section class="panel">


${tabelaFixa(

[
"Produto",
"Descrição",
"Quantidade",
"Observação"
],

montarLinhasEquipamentos(e),

false

)}



</section>


`;



}





function renderInformativo(){


conteudo.innerHTML=`

<div class="page-title">
ℹ️ INFORMATIVO
</div>



<section class="panel">


<h3>
Processos SGQ
</h3>


<p style="
text-align:center;
font-weight:800;
font-size:16px;
line-height:1.8;
">


Este painel apresenta indicadores dos processos de qualidade,
controle operacional, inspeções, retrabalho, descarte,
amostras e equipamentos.


</p>


</section>


`;



}






function tabelaFixa(headers,rows){


return `


<div class="table-wrap">


<table>


<thead>

<tr>

${headers.map(h=>

`<th>${h}</th>`

).join("")}

</tr>


</thead>



<tbody>


${rows || `

<tr>

<td colspan="${headers.length}">
Sem dados
</td>

</tr>

`}


</tbody>


</table>


</div>



`;



}






function montarLinhasImportacao(lista){
