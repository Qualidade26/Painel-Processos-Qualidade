<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Processos SGQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#dfeeff;
    --top1:#0f3cc9;
    --top2:#1d4eff;
    --card:#f8fbff;
    --card2:#eef5ff;
    --primary:#1d4eff;
    --primary-dark:#0f3cc9;
    --line:#b8d1ff;
    --line2:#dce8ff;
    --text:#0f1f4d;
    --muted:#5c6c96;

    --green:#22c55e;
    --pink:#f04dd8;
    --purple:#8b5cf6;
    --red:#ef4444;
    --orange:#f97316;
    --cyan:#38bdf8;
}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:Arial, Helvetica, sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

}



.topbar{

    height:72px;

    background:linear-gradient(90deg,var(--top1),var(--top2));

    color:#fff;

    display:grid;

    grid-template-columns:260px 1fr 310px;

    align-items:center;

    padding:0 18px;

    box-shadow:0 4px 12px rgba(0,0,0,.18);

}



.logo-labor{

    border-right:1px solid rgba(255,255,255,.35);

    height:55px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    line-height:1;

}



.logo-main{

    font-size:34px;

    font-weight:900;

    letter-spacing:5px;

}


.logo-sub{

    font-size:10px;

    font-weight:900;

    letter-spacing:5px;

    margin-top:6px;

}


.top-title{

    text-align:center;

}


.top-title h1{

    margin:0;

    font-size:27px;

    letter-spacing:.5px;

    font-weight:900;

}


.top-title p{

    margin:6px 0 0;

    font-size:12px;

    font-weight:900;

}



.top-status{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:8px;

    font-size:11px;

    font-weight:900;

}


.pill{

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.25);

    padding:9px 12px;

    border-radius:10px;

    box-shadow:inset 0 0 12px rgba(255,255,255,.08);

    min-width:116px;

    height:36px;

    display:flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

}


.data-pill{

    min-width:132px;

}


.time-pill{

    min-width:116px;

}


.online-dot{

    color:#27ff6f;

    margin-right:4px;

}




.main-wrap{

    height:calc(100vh - 72px);

    display:grid;

    grid-template-columns:172px 1fr;

    gap:10px;

    padding:10px;

    transition:grid-template-columns .25s ease;

}



.main-wrap.menu-collapsed{

    grid-template-columns:68px 1fr;

}



.menu{

    background:rgba(248,251,255,.92);

    border:1px solid var(--line);

    border-radius:12px;

    padding:10px;

    box-shadow:0 4px 12px rgba(0,0,0,.06);

    overflow:auto;

}



.toggle-menu{

    width:100%;

    height:34px;

    border:none;

    background:linear-gradient(90deg,var(--top1),var(--top2));

    color:#fff;

    border-radius:10px;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    margin-bottom:10px;

}



.menu button{

    width:100%;

    min-height:58px;

    border:1px solid var(--line2);

    background:linear-gradient(180deg,#fff,var(--card2));

    color:var(--text);

    margin-bottom:8px;

    border-radius:11px;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

    text-align:center;

}



.menu button .ico{

    font-size:25px;

    display:block;

}



.menu button:hover,

.menu button.active{

    background:linear-gradient(90deg,var(--top1),var(--top2));

    color:white;

}



.content{

    overflow:auto;

    padding-right:2px;

}



.page-title{

    background:var(--card);

    color:var(--primary);

    border:1px solid var(--line);

    border-radius:12px;

    padding:9px;

    text-align:center;

    font-weight:900;

    font-size:17px;

    margin-bottom:8px;

}



.cards{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:8px;

    margin-bottom:8px;

}



.kpi-card{

    background:linear-gradient(180deg,#fff,var(--card2));

    border:1px solid var(--line);

    border-radius:12px;

    padding:12px;

    min-height:72px;

    display:grid;

    grid-template-columns:48px 1fr;

    align-items:center;

}


.kpi-icon{

    width:42px;

    height:42px;

    border-radius:12px;

    background:#e8f0ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

}


.kpi-card strong{

    font-size:28px;

    font-weight:900;

}


.panel{

    background:rgba(248,251,255,.95);

    border:1px solid var(--line);

    border-radius:12px;

    padding:10px;

}



.panel h3{

    margin:0 0 8px;

    text-align:center;

    color:var(--primary);

    font-size:14px;

    font-weight:900;

}



.chart-box{

    height:300px;

    position:relative;

}



.chart-box.tall{

    height:360px;

}


.grid-2{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}


.grid-3-2{

    display:grid;

    grid-template-columns:1.35fr .9fr;

    gap:8px;

}
.table-wrap{

    border:1px solid var(--line2);

    border-radius:10px;

    overflow:hidden;

    background:white;

}


.table-scroll{

    max-height:400px;

    overflow-y:auto;

}



table{

    width:100%;

    border-collapse:collapse;

    table-layout:fixed;

    font-size:14px;

}



thead th{

    position:sticky;

    top:0;

    background:#e8f0ff;

    color:var(--primary);

    padding:10px;

    font-weight:900;

}



td{

    padding:7px;

    border-bottom:1px solid var(--line2);

    text-align:center;

    font-weight:900;

}



td.desc{

    text-align:left;

}


.status-ok{

    color:var(--green);

}


.status-nok{

    color:var(--red);

}



.rank-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

}



.rank-card{

    background:#e8f0ff;

    border:1px solid var(--line);

    border-radius:10px;

    padding:8px;

    font-weight:900;

}



.fluxo{

    display:grid;

    grid-template-columns:1fr 30px 1fr 30px 1fr;

    gap:5px;

    align-items:center;

}



.fluxo-item{

    background:#eef5ff;

    border:1px solid var(--line2);

    border-radius:12px;

    padding:14px;

    text-align:center;

    font-weight:900;

}



.fluxo-item strong{

    font-size:26px;

    color:var(--primary);

}



.fluxo-item.pink strong{

    color:var(--pink);

}



.fluxo-item.green strong{

    color:var(--green);

}



.fluxo-arrow{

    text-align:center;

    font-size:22px;

}



.progress-box{

    width:100%;

    height:22px;

    background:#dce8ff;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar{

    height:100%;

    background:linear-gradient(90deg,#16a34a,#22c55e);

    color:white;

    text-align:center;

    font-weight:900;

    line-height:22px;

}



.senha-box{

    max-width:430px;

    margin:80px auto;

    background:white;

    border:1px solid var(--line);

    border-radius:14px;

    padding:24px;

    text-align:center;

}



.btn{

    border:none;

    background:var(--primary);

    color:white;

    padding:11px 16px;

    border-radius:10px;

    font-weight:900;

    cursor:pointer;

}



.info-menu{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

}



.info-menu button{

    border:none;

    background:var(--primary);

    color:white;

    padding:10px 14px;

    border-radius:10px;

    font-weight:900;

}



.info-text{

    text-align:center;

    font-size:16px;

    line-height:1.7;

    font-weight:700;

}



.process-steps{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:8px;

}



.step{

    background:#e8f0ff;

    border:1px solid var(--line);

    border-radius:12px;

    padding:12px;

    text-align:center;

    font-weight:900;

}



.footer-note{

    font-size:10px;

    text-align:center;

}



@media(max-width:1050px){

.topbar{

grid-template-columns:1fr;

height:auto;

gap:8px;

}


.main-wrap{

grid-template-columns:1fr;

height:auto;

}


.grid-2,

.grid-3-2{

grid-template-columns:1fr;

}

}



</style>

</head>


<body>


<header class="topbar">


<div class="logo-labor">

<div class="logo-main">LABOR</div>

<div class="logo-sub">HEALTH SUPPLY</div>

</div>



<div class="top-title">

<h1>PAINEL DE PROCESSOS SGQ</h1>

<p>Indicadores operacionais em tempo real</p>

</div>



<div class="top-status">

<span class="pill data-pill" id="dataAtual">-- --- ----</span>

<span class="pill time-pill" id="horaAtual">--:--:--</span>

<span class="pill">

<span class="online-dot">●</span>Online

</span>


</div>


</header>



<div class="main-wrap" id="mainWrap">


<aside class="menu">


<button 
class="toggle-menu"
id="btnToggleMenu"
onclick="toggleMenu()">

◀

</button>



<button class="active" onclick="abrirAba('importacao',this)">

<span class="ico">📦</span>

Inspeção Importação

</button>


<button onclick="abrirAba('esfig',this)">

<span class="ico">⏱</span>

Esfigmomanômetro

</button>



<button onclick="abrirAba('descarte',this)">

<span class="ico">🗑</span>

Descarte

</button>



<button onclick="abrirAba('amostra',this)">

<span class="ico">📦</span>

Amostra

</button>



<button onclick="abrirAba('retrabalho',this)">

<span class="ico">🔄</span>

Retrabalho

</button>



<button onclick="abrirAba('equipamentos',this)">

<span class="ico">🛠</span>

Equipamentos

</button>



<button onclick="abrirAba('informativo',this)">

<span class="ico">ℹ️</span>

Informativo

</button>



</aside>



<main class="content" id="conteudo"></main>


</div>



<script>


let dados={};

let graficoAtual=null;

let senhaDescarteLiberada=false;



const valorFlutuantePlugin={

id:"valorFlutuante",


afterDatasetsDraw(chart){


const {ctx}=chart;


ctx.save();



chart.data.datasets.forEach((dataset,datasetIndex)=>{


const meta=chart.getDatasetMeta(datasetIndex);


if(meta.hidden)return;



meta.data.forEach((element,index)=>{


const valor=dataset.data[index];



if(valor===null || valor===undefined)return;



ctx.font="900 11px Arial";


ctx.fillStyle="#0f1f4d";



let texto=Number(valor).toLocaleString("pt-BR");



ctx.textAlign="center";


ctx.textBaseline="bottom";



ctx.fillText(

texto,

element.x,

element.y-8

);



});


});


ctx.restore();


}

};



Chart.register(valorFlutuantePlugin);



fetch("data.json")

.then(r=>r.json())

.then(json=>{

dados=normalizarDados(json);

renderImportacao();

})

.catch(()=>{

dados=normalizarDados({});

renderImportacao();

});



setInterval(()=>{

fetch("data.json")

.then(r=>r.json())

.then(json=>{

dados=normalizarDados(json);


const aba=document.querySelector(".menu button.active");


if(aba){

aba.click();

}


});


},120000);



function normalizarDados(json){


if(Array.isArray(json.esfig)){


json.esfig={

produtos:json.esfig

};


}


return json;


}
function abrirAba(aba,botao){

    document.querySelectorAll(".menu button")
    .forEach(b=>b.classList.remove("active"));


    if(botao)
        botao.classList.add("active");


    destruirGrafico();


    if(aba==="importacao")
        renderImportacao();

    if(aba==="esfig")
        renderEsfig();

    if(aba==="descarte")
        renderDescarte();

    if(aba==="amostra")
        renderAmostra();

    if(aba==="retrabalho")
        renderRetrabalho();

    if(aba==="equipamentos")
        renderEquipamentos();

    if(aba==="informativo")
        renderInformativo();

}



function destruirGrafico(){

    if(graficoAtual){

        graficoAtual.destroy();

        graficoAtual=null;

    }

}



function numero(v){

    return Number(v||0)
    .toLocaleString("pt-BR");

}



function moeda(v){

return Number(v||0)
.toLocaleString("pt-BR",{
style:"currency",
currency:"BRL"
});

}



function atualizarRelogio(){

const agora=new Date();


document.getElementById("dataAtual").innerText =
agora.toLocaleDateString("pt-BR");


document.getElementById("horaAtual").innerText =
agora.toLocaleTimeString("pt-BR");


}


setInterval(atualizarRelogio,1000);

atualizarRelogio();





function toggleMenu(){

const wrap=document.getElementById("mainWrap");

wrap.classList.toggle("menu-collapsed");

}




/* =====================================================
   GRÁFICO IMPORTAÇÃO AJUSTADO
   4 BARRAS AGRUPADAS + LINHA DE HORAS
===================================================== */


function renderImportacao(){


const imp=dados.importacao || {

processosAno:0,

totalSku:0,

totalLotes:0,

laudosEmitidos:0,

totalHoras:0,

mensal:[],

fluxo:[]

};



conteudo.innerHTML=`


<div class="page-title">

📦 INSPEÇÃO DE IMPORTAÇÃO

</div>



<section class="cards">


${card(
"📦",
"Processos por Ano",
numero(imp.processosAno),
"Quantidade de processos"
)}



${card(
"🏷️",
"Total de SKU",
numero(imp.totalSku),
"SKUs inspecionados"
)}



${card(
"📑",
"Total de Lotes",
numero(imp.totalLotes),
"Lotes controlados"
)}



${card(
"🧾",
"Laudos Emitidos",
numero(imp.laudosEmitidos),
"Registros emitidos"
)}



${card(
"⏱",
"Total de Horas",
numero(imp.totalHoras),
"Horas atividade"
)}



</section>



<section class="panel">


<h3>

📊 Evolução Mensal Inspeção de Importação

</h3>



<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>




<section class="panel">


<h3>

📋 Fluxo Inspeção de Importação

</h3>



${

tabelaFixa(

[
"PO",
"Descrição do Produto",
"Status",
"Observação"
],

montarLinhasImportacao(imp.fluxo),

false

)

}


</section>



`;





const mensal=imp.mensal || [];



graficoAtual=new Chart(

document.getElementById("grafico"),

{


type:"bar",


data:{


labels:mensal.map(i=>i.mes),


datasets:[



{

label:"Processos",

data:mensal.map(i=>Number(i.processos||0)),

backgroundColor:"#1d4eff",

borderRadius:6,

barPercentage:.8,

categoryPercentage:.7

},



{

label:"SKU",

data:mensal.map(i=>Number(i.sku||0)),

backgroundColor:"#f04dd8",

borderRadius:6,

barPercentage:.8,

categoryPercentage:.7

},



{

label:"Lotes",

data:mensal.map(i=>Number(i.lotes||0)),

backgroundColor:"#22c55e",

borderRadius:6,

barPercentage:.8,

categoryPercentage:.7

},



{

label:"Laudos",

data:mensal.map(i=>Number(i.laudos||0)),

backgroundColor:"#8b5cf6",

borderRadius:6,

barPercentage:.8,

categoryPercentage:.7

},



{

label:"Horas",

type:"line",

data:mensal.map(i=>Number(i.horas||0)),


borderColor:"#f97316",

backgroundColor:"#f97316",


borderWidth:3,


tension:.35,


pointRadius:5,


pointHoverRadius:7,


yAxisID:"horas",


order:0


}



]


},




options:{


responsive:true,


maintainAspectRatio:false,



interaction:{


mode:"index",

intersect:false


},



layout:{


padding:{


top:25,

right:35,

left:10,

bottom:10


}


},



scales:{



y:{


beginAtZero:true,


title:{


display:true,

text:"Quantidade"


}



},




horas:{


beginAtZero:true,


position:"right",


title:{


display:true,

text:"Horas"


},


grid:{


drawOnChartArea:false


},


ticks:{


color:"#f97316"


}


},



x:{


grid:{


display:false


}


}



},



plugins:{


legend:{


labels:{


font:{


weight:"900"


}


}


},



tooltip:{


enabled:true


}


}



}




}



);



}
function renderEsfig(){

const esfig=dados.esfig || {};

const produtos=esfig.produtos || [];


conteudo.innerHTML=`


<div class="page-title">

⏱ ESFIGMOMANÔMETRO

</div>



<section class="cards">


${card(
"💰",
"Total Gasto GRU",
moeda(esfig.totalGruInmetro),
"Valor pago ao Inmetro"
)}



${card(
"📅",
"Última Aferição",
esfig.ultimaAfericao || "-",
"Data registrada"
)}



${card(
"📆",
"Próxima Aferição",
esfig.proximaAfericao || "-",
"Previsão"
)}


</section>




<section class="grid-2">


<div class="panel">

<h3>
⏱ Fluxo Operacional
</h3>


${tabelaFixa(

[
"SKU",
"Descrição",
"Aguardando",
"Desmontado",
"Aferido"
],

montarLinhasEsfig(produtos),

true

)}


</div>



<div class="panel">

<h3>
Total por SKU
</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</div>


</section>


`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{

type:"bar",

data:{


labels:produtos.map(i=>i.sku),


datasets:[{

label:"Total",

data:produtos.map(i=>Number(i.totalAnualSku||0)),

backgroundColor:"#1d4eff"

}]


},


options:{

responsive:true,

maintainAspectRatio:false,

indexAxis:"y"


}


}

);



}






function renderDescarte(){


if(!senhaDescarteLiberada){


conteudo.innerHTML=`

<div class="senha-box">

<h2>
🔒 Área Restrita
</h2>

<input 
type="password"
id="senhaDescarte"
placeholder="Senha">


<button class="btn"
onclick="validarSenhaDescarte()">

Acessar

</button>


<p id="erroSenha"></p>


</div>

`;

return;

}



const d=dados.descarte || {};



conteudo.innerHTML=`


<div class="page-title">

🗑 DESCARTE

</div>



<section class="grid-2">


<div class="panel">


<h3>

Descarte por Origem

</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</div>



<div class="panel">

<h3>

Top Descarte

</h3>


${tabelaFixa(

[
"SKU",
"Descrição",
"Valor"
],

montarLinhasTopDescarte(d.top10),

true

)}


</div>



</section>


`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{

type:"bar",

data:{

labels:(d.origens||[]).map(i=>i.nome),

datasets:[{

label:"Valor",

data:(d.origens||[]).map(i=>i.valor),

backgroundColor:"#1d4eff"

}]

},


options:{

responsive:true,

maintainAspectRatio:false,

indexAxis:"y"

}


}

);



}





function validarSenhaDescarte(){


const senha=document.getElementById("senhaDescarte").value;


if(senha==="SGQ2026"){

senhaDescarteLiberada=true;

renderDescarte();

}

else{

document.getElementById("erroSenha").innerText="Senha incorreta";

}


}






function renderAmostra(){


const a=dados.amostras || {};



conteudo.innerHTML=`


<div class="page-title">

📦 AMOSTRA

</div>


<section class="panel">


<h3>

Evolução Mensal

</h3>


<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>


`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{

type:"line",

data:{


labels:(a.mensal||[]).map(i=>i.mes),


datasets:[{


label:"Quantidade",

data:(a.mensal||[]).map(i=>i.valor),

borderColor:"#1d4eff",

backgroundColor:"#1d4eff"

}]


}

}

);


}





function renderRetrabalho(){


const r=dados.retrabalho || {fabricantes:[]};



conteudo.innerHTML=`


<div class="page-title">

🔄 RETRABALHO

</div>


<section class="panel">


<h3>

🏭 Retrabalho por Fabricante

</h3>



<div class="chart-box">

<canvas id="grafico"></canvas>

</div>


</section>


`;



graficoAtual=new Chart(

document.getElementById("grafico"),

{

type:"bar",

data:{


labels:r.fabricantes.map(i=>i.fabricante),


datasets:[{


label:"Quantidade",

data:r.fabricantes.map(i=>i.quantidade),

backgroundColor:"#1d4eff"

}]


},


options:{

responsive:true,

maintainAspectRatio:false,

indexAxis:"y"

}


}

);


}






function renderEquipamentos(){


const lista=dados.equipamentos||[];



conteudo.innerHTML=`


<div class="page-title">

🛠 EQUIPAMENTOS

</div>


<section class="panel">


${

tabelaFixa(

[
"Produto",
"Descrição",
"Quantidade",
"Observação"
],
